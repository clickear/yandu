spring:
  application:
    name: yandu-backend
  datasource:
    url: ${YANDU_DB_URL}
    username: ${YANDU_DB_USER}
    password: ${YANDU_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${YANDU_OIDC_ISSUER_URI}
          audiences:
            - ${YANDU_OIDC_AUDIENCE}

springdoc:
  api-docs:
    path: /api/v1/openapi
    version: OPENAPI_3_1
  packages-to-scan: com.yandu.web
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

server:
  error:
    include-message: never
    include-stacktrace: never

yandu:
  cors:
    allowed-origins: ${YANDU_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  machine-translation:
    provider: ${YANDU_MT_PROVIDER:libretranslate}
    base-url: ${YANDU_MT_BASE_URL:}
    api-key: ${YANDU_MT_API_KEY:}
    model: ${YANDU_MT_MODEL:}
    timeout-ms: ${YANDU_MT_TIMEOUT_MS:30000}
    poll-ms: ${YANDU_MT_POLL_MS:2000}
