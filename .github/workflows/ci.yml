name: Validate YANDU
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: yandu-ci-root
          MYSQL_DATABASE: yandu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=yandu-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify Java modules and MySQL 8.0 migrations
        run: mvn -B -Psync-netty,sync-websocket -Dyandu.mysql.integration=true -Dyandu.sync.integration=true test
        env:
          YANDU_DB_URL: jdbc:mysql://127.0.0.1:3306/yandu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          YANDU_DB_USER: root
          YANDU_DB_PASSWORD: yandu-ci-root
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run brand:generate && npm run brand:check
      - run: git diff --exit-code -- brand public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:api
      - name: Prepare isolated schema for browser-to-MySQL workflow
        run: mysql --protocol=tcp --host=127.0.0.1 --user=root --password=yandu-ci-root -e "CREATE DATABASE yandu_browser_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
      - name: Verify browser to API to MySQL main workflow
        run: npm run test:e2e:mysql
        env:
          YANDU_E2E_DB_PASSWORD: yandu-ci-root
